# Development override — only runs PostgreSQL
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: genki-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=genki
      - POSTGRES_PASSWORD=genki_dev_password
      - POSTGRES_DB=genki
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genki -d genki"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
