services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: genki-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=:8080
      - DATABASE_URL=postgres://genki:${POSTGRES_PASSWORD:-genki}@db:5432/genki?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - genki-network

  db:
    image: postgres:16-alpine
    container_name: genki-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=genki
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-genki}
      - POSTGRES_DB=genki
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genki -d genki"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genki-network

volumes:
  postgres_data:
    driver: local

networks:
  genki-network:
    driver: bridge
